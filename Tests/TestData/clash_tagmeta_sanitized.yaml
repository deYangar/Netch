mixed-port: 7890
allow-lan: false
mode: rule
log-level: warning
unified-delay: true
keep-alive-interval: 360
cfw-bypass:
  - localhost
  - 127.*
  - 10.*
  - 192.168.*
  - <local>
dns:
  enable: true
  listen: 0.0.0.0:7874
  default-nameserver: [180.184.1.1, 119.29.29.29, 223.5.5.5]
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  use-system-hosts: true
  nameserver:
    - https://223.5.5.5/dns-query
    - https://doh.pub/dns-query
  nameserver-policy:
    ? '+.captive.apple.com,+.msftconnecttest.com,+.connect.rom.miui.com,+.connectivitycheck.gstatic.com,+.connectivitycheck.platform.hicloud.com'
    : - '119.29.29.29'
      - '223.5.5.5'
      - '114.114.114.114'
  fake-ip-filter:
    - "*.lan"
    - "*.localdomain"
    - "*.invalid"
    - "*.localhost"
    - "*.test"
    - "*.local"
    - "*.home.arpa"
    - '+.msftncsi.com'
    - '*.time.edu.cn'
    - '*.ntp.org.cn'
    - '+.pool.ntp.org'
    - '+.bilivideo.com'
    - '+.douyinvod.com'
    - 'captive.apple.com'
    - 'connect.rom.miui.com'
    - '+.example-g.test'
    - '+.example-f.test'
    - '+.example-e.test'
    - 'www.msftconnecttest.com'
    - 'wifi.vivo.com.cn'
    - 'connectivitycheck.platform.hicloud.com'
    - '+.feishu.cn'
    - '+.dingtalk.com'
    - '+.chat.bilibili.com'
    - stun.*.*
    - stun.*.*.*
  proxy-server-nameserver:
    - udp://127.0.0.1:7874
